apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformlab-api
  namespace: dev
  labels:
    app: platformlab-api
spec:
  replicas: 3
  # Immutable after creation. Must match the pod template labels below.
  selector:
    matchLabels:
      app: platformlab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the replica count: add a new ready pod before
      # removing an old one. A failing readiness probe stalls the rollout
      # rather than draining capacity.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: platformlab-api
    spec:
      containers:
        - name: api
          # Hardcoding the registry here is a known wart: the name carries a
          # random suffix, so recreating the registry breaks this file. That is
          # the coupling a Helm value removes.
          image: acrplatformlabdevp66cyi.azurecr.io/platformlab-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: platformlab-api
          env:
            - name: RELEASE
              value: "0.1.0"
            # Surfaces which pod answered, so load balancing is visible.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Process-local only. Never check a dependency here: a shared
          # outage would restart every replica at once.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Failing this removes the pod from Service endpoints without
          # restarting it. Dependency checks belong here.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            # Measured on AKS: this app idles at 1m CPU and 35Mi. 20m gives
            # twenty times headroom for bursts without reserving capacity
            # nobody uses. At 50m only 15 replicas fit on one node; at 20m,
            # twenty fit, on the same hardware.
            requests:
              cpu: "20m"
              memory: "48Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
