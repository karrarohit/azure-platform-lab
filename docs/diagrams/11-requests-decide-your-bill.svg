<svg xmlns="http://www.w3.org/2000/svg" width="680" height="304" viewBox="0 0 680 304" role="img"><title>How reserved capacity decides the number of machines you pay for</title><desc>With requests set from measurement, six pods fit on one machine. With inflated requests for the same app, only two fit, so three machines are needed and the bill triples.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3A4450}.ts{font-size:12px;fill:#5A6673}.th{font-size:14px;font-weight:500;fill:#1A2029}rect{stroke-width:.5}.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#B4B2A9}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#5F5E5A}.c-gray>text.t{fill:#2C2C2A}.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#85B7EB}.c-blue>text.th{fill:#042C53}.c-blue>text.ts{fill:#185FA5}.c-blue>text.t{fill:#042C53}.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#5DCAA5}.c-teal>text.th{fill:#04342C}.c-teal>text.ts{fill:#0F6E56}.c-teal>text.t{fill:#04342C}.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#AFA9EC}.c-purple>text.th{fill:#26215C}.c-purple>text.ts{fill:#534AB7}.c-purple>text.t{fill:#26215C}.c-coral>rect,.c-coral>circle{fill:#FAECE7;stroke:#F0997B}.c-coral>text.th{fill:#4A1B0C}.c-coral>text.ts{fill:#993C1D}.c-coral>text.t{fill:#4A1B0C}.c-green>rect,.c-green>circle{fill:#EAF3DE;stroke:#97C459}.c-green>text.th{fill:#173404}.c-green>text.ts{fill:#3B6D11}.c-green>text.t{fill:#173404}.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#EF9F27}.c-amber>text.th{fill:#412402}.c-amber>text.ts{fill:#854F0B}.c-amber>text.t{fill:#412402}.c-red>rect,.c-red>circle{fill:#FCEBEB;stroke:#F09595}.c-red>text.th{fill:#501313}.c-red>text.ts{fill:#A32D2D}.c-red>text.t{fill:#501313}</style><rect x="0" y="0" width="680" height="304" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="1" rx="6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="20" width="290" height="28" rx="4"/><text class="ts" x="185" y="39" text-anchor="middle">requests set from measurement</text></g>
<rect x="40" y="60" width="290" height="180" rx="4" fill="none" stroke="#9AA5B1" stroke-width="0.5" stroke-dasharray="4 3"/>
<g class="c-green"><rect x="55" y="76" width="125" height="48" rx="4"/><text class="ts" x="117" y="105" text-anchor="middle">asks 50m</text></g>
<g class="c-green"><rect x="195" y="76" width="125" height="48" rx="4"/><text class="ts" x="257" y="105" text-anchor="middle">asks 50m</text></g>
<g class="c-green"><rect x="55" y="130" width="125" height="48" rx="4"/><text class="ts" x="117" y="159" text-anchor="middle">asks 50m</text></g>
<g class="c-green"><rect x="195" y="130" width="125" height="48" rx="4"/><text class="ts" x="257" y="159" text-anchor="middle">asks 50m</text></g>
<g class="c-green"><rect x="55" y="184" width="125" height="48" rx="4"/><text class="ts" x="117" y="213" text-anchor="middle">asks 50m</text></g>
<g class="c-green"><rect x="195" y="184" width="125" height="48" rx="4"/><text class="ts" x="257" y="213" text-anchor="middle">asks 50m</text></g>
<text class="ts" x="185" y="268" text-anchor="middle">six copies fit on one machine</text>
<text class="ts" x="185" y="284" text-anchor="middle">you pay for one machine</text>
<g class="c-gray"><rect x="350" y="20" width="290" height="28" rx="4"/><text class="ts" x="495" y="39" text-anchor="middle">requests set by guessing high</text></g>
<rect x="350" y="60" width="290" height="180" rx="4" fill="none" stroke="#9AA5B1" stroke-width="0.5" stroke-dasharray="4 3"/>
<g class="c-amber"><rect x="365" y="76" width="260" height="70" rx="4"/><text class="ts" x="495" y="106" text-anchor="middle">asks 500m</text><text class="ts" x="495" y="126" text-anchor="middle">actually uses 40m</text></g>
<g class="c-amber"><rect x="365" y="156" width="260" height="70" rx="4"/><text class="ts" x="495" y="186" text-anchor="middle">asks 500m</text><text class="ts" x="495" y="206" text-anchor="middle">actually uses 40m</text></g>
<text class="ts" x="495" y="268" text-anchor="middle">same app, only two copies fit</text>
<text class="ts" x="495" y="284" text-anchor="middle">you pay for three machines</text></svg>