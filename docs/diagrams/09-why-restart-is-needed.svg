<svg xmlns="http://www.w3.org/2000/svg" width="680" height="256" viewBox="0 0 680 256" role="img"><title>Why a config change needs a restart</title><desc>A pod is handed a copy of the settings when it starts. Editing the settings card afterwards does not reach the running pod. Only a restart makes a new pod take a fresh copy.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3A4450}.ts{font-size:12px;fill:#5A6673}.th{font-size:14px;font-weight:500;fill:#1A2029}rect{stroke-width:.5}.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#B4B2A9}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#5F5E5A}.c-gray>text.t{fill:#2C2C2A}.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#85B7EB}.c-blue>text.th{fill:#042C53}.c-blue>text.ts{fill:#185FA5}.c-blue>text.t{fill:#042C53}.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#5DCAA5}.c-teal>text.th{fill:#04342C}.c-teal>text.ts{fill:#0F6E56}.c-teal>text.t{fill:#04342C}.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#AFA9EC}.c-purple>text.th{fill:#26215C}.c-purple>text.ts{fill:#534AB7}.c-purple>text.t{fill:#26215C}.c-coral>rect,.c-coral>circle{fill:#FAECE7;stroke:#F0997B}.c-coral>text.th{fill:#4A1B0C}.c-coral>text.ts{fill:#993C1D}.c-coral>text.t{fill:#4A1B0C}.c-green>rect,.c-green>circle{fill:#EAF3DE;stroke:#97C459}.c-green>text.th{fill:#173404}.c-green>text.ts{fill:#3B6D11}.c-green>text.t{fill:#173404}.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#EF9F27}.c-amber>text.th{fill:#412402}.c-amber>text.ts{fill:#854F0B}.c-amber>text.t{fill:#412402}.c-red>rect,.c-red>circle{fill:#FCEBEB;stroke:#F09595}.c-red>text.th{fill:#501313}.c-red>text.ts{fill:#A32D2D}.c-red>text.t{fill:#501313}</style><rect x="0" y="0" width="680" height="256" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="1" rx="6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="20" width="186" height="28" rx="4"/><text class="ts" x="133" y="39" text-anchor="middle">1. pod starts</text></g>
<g class="c-coral"><rect x="40" y="60" width="186" height="56" rx="4"/><text class="th" x="133" y="84" text-anchor="middle">settings card</text><text class="ts" x="133" y="104" text-anchor="middle">LOG_LEVEL = info</text></g>
<path d="M133 116 V140" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="140" width="186" height="56" rx="4"/><text class="th" x="133" y="164" text-anchor="middle">pod</text><text class="ts" x="133" y="184" text-anchor="middle">copy says: info</text></g>
<text class="ts" x="133" y="220" text-anchor="middle">it takes a copy, once</text>
<text class="ts" x="133" y="236" text-anchor="middle">and memorises it</text>
<g class="c-gray"><rect x="246" y="20" width="186" height="28" rx="4"/><text class="ts" x="339" y="39" text-anchor="middle">2. you edit the card</text></g>
<g class="c-coral"><rect x="246" y="60" width="186" height="56" rx="4"/><text class="th" x="339" y="84" text-anchor="middle">settings card</text><text class="ts" x="339" y="104" text-anchor="middle">LOG_LEVEL = warning</text></g>
<path d="M339 116 V132" fill="none" stroke="#8A94A0" stroke-width="0.5" stroke-dasharray="3 3"/>
<g class="c-amber"><rect x="246" y="140" width="186" height="56" rx="4"/><text class="th" x="339" y="164" text-anchor="middle">same pod</text><text class="ts" x="339" y="184" text-anchor="middle">copy still says: info</text></g>
<text class="ts" x="339" y="220" text-anchor="middle">nothing reaches it</text>
<text class="ts" x="339" y="236" text-anchor="middle">it never looks again</text>
<g class="c-gray"><rect x="452" y="20" width="186" height="28" rx="4"/><text class="ts" x="545" y="39" text-anchor="middle">3. you restart it</text></g>
<g class="c-coral"><rect x="452" y="60" width="186" height="56" rx="4"/><text class="th" x="545" y="84" text-anchor="middle">settings card</text><text class="ts" x="545" y="104" text-anchor="middle">LOG_LEVEL = warning</text></g>
<path d="M545 116 V140" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="452" y="140" width="186" height="56" rx="4"/><text class="th" x="545" y="164" text-anchor="middle">brand new pod</text><text class="ts" x="545" y="184" text-anchor="middle">copy says: warning</text></g>
<text class="ts" x="545" y="220" text-anchor="middle">a new pod walks in</text>
<text class="ts" x="545" y="236" text-anchor="middle">and takes a fresh copy</text></svg>