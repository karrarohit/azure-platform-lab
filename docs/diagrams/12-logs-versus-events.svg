<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" role="img"><title>Whether to read logs or events when something is wrong</title><desc>If the pod is running but behaving oddly, read the logs to see what your app printed. If the pod never started, the logs are empty and you must read the events to see what Kubernetes tried to do.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3A4450}.ts{font-size:12px;fill:#5A6673}.th{font-size:14px;font-weight:500;fill:#1A2029}rect{stroke-width:.5}.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#B4B2A9}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#5F5E5A}.c-gray>text.t{fill:#2C2C2A}.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#85B7EB}.c-blue>text.th{fill:#042C53}.c-blue>text.ts{fill:#185FA5}.c-blue>text.t{fill:#042C53}.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#5DCAA5}.c-teal>text.th{fill:#04342C}.c-teal>text.ts{fill:#0F6E56}.c-teal>text.t{fill:#04342C}.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#AFA9EC}.c-purple>text.th{fill:#26215C}.c-purple>text.ts{fill:#534AB7}.c-purple>text.t{fill:#26215C}.c-coral>rect,.c-coral>circle{fill:#FAECE7;stroke:#F0997B}.c-coral>text.th{fill:#4A1B0C}.c-coral>text.ts{fill:#993C1D}.c-coral>text.t{fill:#4A1B0C}.c-green>rect,.c-green>circle{fill:#EAF3DE;stroke:#97C459}.c-green>text.th{fill:#173404}.c-green>text.ts{fill:#3B6D11}.c-green>text.t{fill:#173404}.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#EF9F27}.c-amber>text.th{fill:#412402}.c-amber>text.ts{fill:#854F0B}.c-amber>text.t{fill:#412402}.c-red>rect,.c-red>circle{fill:#FCEBEB;stroke:#F09595}.c-red>text.th{fill:#501313}.c-red>text.ts{fill:#A32D2D}.c-red>text.t{fill:#501313}</style><rect x="0" y="0" width="680" height="264" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="1" rx="6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="250" y="20" width="180" height="44" rx="4"/><text class="th" x="340" y="42" text-anchor="middle">something is wrong</text><text class="ts" x="340" y="58" text-anchor="middle">ask one question first</text></g>
<path d="M340 64 V82 H185 V100" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 82 H495 V100" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="100" width="290" height="52" rx="4"/><text class="th" x="185" y="124" text-anchor="middle">it is running</text><text class="ts" x="185" y="142" text-anchor="middle">but behaving oddly</text></g>
<g class="c-gray"><rect x="350" y="100" width="290" height="52" rx="4"/><text class="th" x="495" y="124" text-anchor="middle">it never started</text><text class="ts" x="495" y="142" text-anchor="middle">so the logs are empty</text></g>
<path d="M185 152 V176" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M495 152 V176" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="176" width="290" height="68" rx="4"/><text class="th" x="185" y="202" text-anchor="middle">read the logs</text><text class="ts" x="185" y="222" text-anchor="middle">kubectl logs pod-name</text><text class="ts" x="185" y="240" text-anchor="middle">what your app printed</text></g>
<g class="c-purple"><rect x="350" y="176" width="290" height="68" rx="4"/><text class="th" x="495" y="202" text-anchor="middle">read the events</text><text class="ts" x="495" y="222" text-anchor="middle">kubectl describe pod pod-name</text><text class="ts" x="495" y="240" text-anchor="middle">what kubernetes tried to do</text></g></svg>