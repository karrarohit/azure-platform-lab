<svg xmlns="http://www.w3.org/2000/svg" width="680" height="266" viewBox="0 0 680 266" role="img"><title>What a pod contains</title><desc>A pod wraps a container, which wraps your app. Almost always one container per pod. Occasionally two containers that must run side by side share one pod.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3A4450}.ts{font-size:12px;fill:#5A6673}.th{font-size:14px;font-weight:500;fill:#1A2029}rect{stroke-width:.5}.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#B4B2A9}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#5F5E5A}.c-gray>text.t{fill:#2C2C2A}.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#85B7EB}.c-blue>text.th{fill:#042C53}.c-blue>text.ts{fill:#185FA5}.c-blue>text.t{fill:#042C53}.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#5DCAA5}.c-teal>text.th{fill:#04342C}.c-teal>text.ts{fill:#0F6E56}.c-teal>text.t{fill:#04342C}.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#AFA9EC}.c-purple>text.th{fill:#26215C}.c-purple>text.ts{fill:#534AB7}.c-purple>text.t{fill:#26215C}.c-coral>rect,.c-coral>circle{fill:#FAECE7;stroke:#F0997B}.c-coral>text.th{fill:#4A1B0C}.c-coral>text.ts{fill:#993C1D}.c-coral>text.t{fill:#4A1B0C}.c-green>rect,.c-green>circle{fill:#EAF3DE;stroke:#97C459}.c-green>text.th{fill:#173404}.c-green>text.ts{fill:#3B6D11}.c-green>text.t{fill:#173404}.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#EF9F27}.c-amber>text.th{fill:#412402}.c-amber>text.ts{fill:#854F0B}.c-amber>text.t{fill:#412402}.c-red>rect,.c-red>circle{fill:#FCEBEB;stroke:#F09595}.c-red>text.th{fill:#501313}.c-red>text.ts{fill:#A32D2D}.c-red>text.t{fill:#501313}</style><rect x="0" y="0" width="680" height="266" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="1" rx="6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="290" height="170" rx="4"/><text class="ts" x="56" y="62">pod</text></g>
<g class="c-gray"><rect x="58" y="74" width="254" height="120" rx="4"/><text class="ts" x="74" y="94">container</text></g>
<g class="c-coral"><rect x="76" y="106" width="218" height="72" rx="4"/><text class="th" x="185" y="136" text-anchor="middle">your app</text><text class="ts" x="185" y="156" text-anchor="middle">main.py + python + fastapi</text></g>
<text class="ts" x="185" y="238" text-anchor="middle">almost always this</text>
<text class="ts" x="185" y="254" text-anchor="middle">one container per pod</text>
<g class="c-teal"><rect x="350" y="40" width="290" height="170" rx="4"/><text class="ts" x="366" y="62">pod</text></g>
<g class="c-gray"><rect x="368" y="74" width="120" height="120" rx="4"/><text class="ts" x="384" y="94">container</text></g>
<g class="c-coral"><rect x="380" y="106" width="96" height="72" rx="4"/><text class="ts" x="428" y="146" text-anchor="middle">your app</text></g>
<g class="c-gray"><rect x="502" y="74" width="120" height="120" rx="4"/><text class="ts" x="518" y="94">container</text></g>
<g class="c-coral"><rect x="514" y="106" width="96" height="72" rx="4"/><text class="ts" x="562" y="146" text-anchor="middle">log shipper</text></g>
