<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img"><title>A Deployment is a written instruction that produces pods</title><desc>You write one note saying which app, which version and how many copies. Kubernetes reads it and creates that many pods, then keeps the count correct.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3A4450}.ts{font-size:12px;fill:#5A6673}.th{font-size:14px;font-weight:500;fill:#1A2029}rect{stroke-width:.5}.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#B4B2A9}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#5F5E5A}.c-gray>text.t{fill:#2C2C2A}.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#85B7EB}.c-blue>text.th{fill:#042C53}.c-blue>text.ts{fill:#185FA5}.c-blue>text.t{fill:#042C53}.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#5DCAA5}.c-teal>text.th{fill:#04342C}.c-teal>text.ts{fill:#0F6E56}.c-teal>text.t{fill:#04342C}.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#AFA9EC}.c-purple>text.th{fill:#26215C}.c-purple>text.ts{fill:#534AB7}.c-purple>text.t{fill:#26215C}.c-coral>rect,.c-coral>circle{fill:#FAECE7;stroke:#F0997B}.c-coral>text.th{fill:#4A1B0C}.c-coral>text.ts{fill:#993C1D}.c-coral>text.t{fill:#4A1B0C}.c-green>rect,.c-green>circle{fill:#EAF3DE;stroke:#97C459}.c-green>text.th{fill:#173404}.c-green>text.ts{fill:#3B6D11}.c-green>text.t{fill:#173404}.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#EF9F27}.c-amber>text.th{fill:#412402}.c-amber>text.ts{fill:#854F0B}.c-amber>text.t{fill:#412402}.c-red>rect,.c-red>circle{fill:#FCEBEB;stroke:#F09595}.c-red>text.th{fill:#501313}.c-red>text.ts{fill:#A32D2D}.c-red>text.t{fill:#501313}</style><rect x="0" y="0" width="680" height="230" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="1" rx="6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="40" y="40" width="280" height="170" rx="4"/><text class="th" x="180" y="70" text-anchor="middle">the note you write</text><text class="ts" x="64" y="104">it is called a deployment</text><text class="ts" x="64" y="132">app: platformlab-api</text><text class="ts" x="64" y="156">version: 0.2.0</text><text class="ts" x="64" y="180">copies: 3</text></g>
<path d="M320 125 H360" fill="none" stroke="#8A94A0" stroke-width="0.5"/>
<path d="M360 62 V188" fill="none" stroke="#8A94A0" stroke-width="0.5"/>
<path d="M360 62 H400" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M360 125 H400" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M360 188 H400" fill="none" stroke="#8A94A0" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="40" width="240" height="44" rx="4"/><text class="ts" x="520" y="67" text-anchor="middle">pod / copy 1</text></g>
