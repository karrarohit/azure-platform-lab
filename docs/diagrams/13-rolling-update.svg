<svg xmlns="http://www.w3.org/2000/svg" width="680" height="276" viewBox="0 0 680 276" role="img"><title>A rolling update replaces copies one at a time</title><desc>Starting from three copies of the old version, one new copy is added but is not ready yet. Once it says it is ready, an old copy is removed. This repeats until all copies are the new version, with no loss of capacity.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3A4450}.ts{font-size:12px;fill:#5A6673}.th{font-size:14px;font-weight:500;fill:#1A2029}rect{stroke-width:.5}.c-gray>rect,.c-gray>circle{fill:#F1EFE8;stroke:#B4B2A9}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#5F5E5A}.c-gray>text.t{fill:#2C2C2A}.c-blue>rect,.c-blue>circle{fill:#E6F1FB;stroke:#85B7EB}.c-blue>text.th{fill:#042C53}.c-blue>text.ts{fill:#185FA5}.c-blue>text.t{fill:#042C53}.c-teal>rect,.c-teal>circle{fill:#E1F5EE;stroke:#5DCAA5}.c-teal>text.th{fill:#04342C}.c-teal>text.ts{fill:#0F6E56}.c-teal>text.t{fill:#04342C}.c-purple>rect,.c-purple>circle{fill:#EEEDFE;stroke:#AFA9EC}.c-purple>text.th{fill:#26215C}.c-purple>text.ts{fill:#534AB7}.c-purple>text.t{fill:#26215C}.c-coral>rect,.c-coral>circle{fill:#FAECE7;stroke:#F0997B}.c-coral>text.th{fill:#4A1B0C}.c-coral>text.ts{fill:#993C1D}.c-coral>text.t{fill:#4A1B0C}.c-green>rect,.c-green>circle{fill:#EAF3DE;stroke:#97C459}.c-green>text.th{fill:#173404}.c-green>text.ts{fill:#3B6D11}.c-green>text.t{fill:#173404}.c-amber>rect,.c-amber>circle{fill:#FAEEDA;stroke:#EF9F27}.c-amber>text.th{fill:#412402}.c-amber>text.ts{fill:#854F0B}.c-amber>text.t{fill:#412402}.c-red>rect,.c-red>circle{fill:#FCEBEB;stroke:#F09595}.c-red>text.th{fill:#501313}.c-red>text.ts{fill:#A32D2D}.c-red>text.t{fill:#501313}</style><rect x="0" y="0" width="680" height="276" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="1" rx="6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="20" width="138" height="28" rx="4"/><text class="ts" x="109" y="39" text-anchor="middle">1. before</text></g>
<g class="c-blue"><rect x="55" y="60" width="108" height="32" rx="4"/><text class="ts" x="109" y="81" text-anchor="middle">0.2.0</text></g>
<g class="c-blue"><rect x="55" y="100" width="108" height="32" rx="4"/><text class="ts" x="109" y="121" text-anchor="middle">0.2.0</text></g>
<g class="c-blue"><rect x="55" y="140" width="108" height="32" rx="4"/><text class="ts" x="109" y="161" text-anchor="middle">0.2.0</text></g>
<text class="ts" x="109" y="240" text-anchor="middle">three copies</text>
<text class="ts" x="109" y="256" text-anchor="middle">of version 0.2.0</text>
<g class="c-gray"><rect x="193" y="20" width="138" height="28" rx="4"/><text class="ts" x="262" y="39" text-anchor="middle">2. add one</text></g>
<g class="c-blue"><rect x="208" y="60" width="108" height="32" rx="4"/><text class="ts" x="262" y="81" text-anchor="middle">0.2.0</text></g>
<g class="c-blue"><rect x="208" y="100" width="108" height="32" rx="4"/><text class="ts" x="262" y="121" text-anchor="middle">0.2.0</text></g>
<g class="c-blue"><rect x="208" y="140" width="108" height="32" rx="4"/><text class="ts" x="262" y="161" text-anchor="middle">0.2.0</text></g>
<g class="c-amber"><rect x="208" y="180" width="108" height="32" rx="4"/><text class="ts" x="262" y="201" text-anchor="middle">0.3.0</text></g>
<text class="ts" x="262" y="240" text-anchor="middle">one new one added</text>
<text class="ts" x="262" y="256" text-anchor="middle">not ready yet</text>
<g class="c-gray"><rect x="346" y="20" width="138" height="28" rx="4"/><text class="ts" x="415" y="39" text-anchor="middle">3. swap</text></g>
<g class="c-blue"><rect x="361" y="60" width="108" height="32" rx="4"/><text class="ts" x="415" y="81" text-anchor="middle">0.2.0</text></g>
<g class="c-blue"><rect x="361" y="100" width="108" height="32" rx="4"/><text class="ts" x="415" y="121" text-anchor="middle">0.2.0</text></g>
<g class="c-green"><rect x="361" y="140" width="108" height="32" rx="4"/><text class="ts" x="415" y="161" text-anchor="middle">0.3.0</text></g>
<g class="c-amber"><rect x="361" y="180" width="108" height="32" rx="4"/><text class="ts" x="415" y="201" text-anchor="middle">0.3.0</text></g>
<text class="ts" x="415" y="240" text-anchor="middle">it said yes</text>
<text class="ts" x="415" y="256" text-anchor="middle">one old removed</text>
<g class="c-gray"><rect x="499" y="20" width="138" height="28" rx="4"/><text class="ts" x="568" y="39" text-anchor="middle">4. done</text></g>
<g class="c-green"><rect x="514" y="60" width="108" height="32" rx="4"/><text class="ts" x="568" y="81" text-anchor="middle">0.3.0</text></g>
<g class="c-green"><rect x="514" y="100" width="108" height="32" rx="4"/><text class="ts" x="568" y="121" text-anchor="middle">0.3.0</text></g>
<g class="c-green"><rect x="514" y="140" width="108" height="32" rx="4"/><text class="ts" x="568" y="161" text-anchor="middle">0.3.0</text></g>
<text class="ts" x="568" y="240" text-anchor="middle">all three are new</text>
<text class="ts" x="568" y="256" text-anchor="middle">nobody noticed</text></svg>